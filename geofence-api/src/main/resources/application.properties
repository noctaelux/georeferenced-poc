# ---------------------------------------------------------------------------
# Datasource (PostgreSQL + PostGIS)
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USER:geofence}
%prod.quarkus.datasource.password=${DB_PASSWORD:geofence}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:geofence}

# En dev/test Quarkus levanta automáticamente un contenedor con PostGIS (Dev Services)
quarkus.datasource.devservices.image-name=postgis/postgis:17-3.5

# ---------------------------------------------------------------------------
# Esquema administrado por Flyway; Hibernate no genera DDL
# ---------------------------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none
%dev.quarkus.hibernate-orm.log.sql=true

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI
# ---------------------------------------------------------------------------
quarkus.smallrye-openapi.info-title=Geofence API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Gestión de geocercas georreferenciadas con PostGIS
quarkus.swagger-ui.always-include=true
