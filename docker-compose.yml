services:
  db:
    build: ./docker/postgis
    image: geofence-postgis:17-3
    container_name: geofence-db
    environment:
      POSTGRES_DB: geofence
      POSTGRES_USER: geofence
      POSTGRES_PASSWORD: geofence
    ports:
      - "5432:5432"
    volumes:
      - geofence-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geofence -d geofence"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./geofence-api
    image: geofence-api:1.0.0
    container_name: geofence-api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: geofence
      DB_USER: geofence
      DB_PASSWORD: geofence
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  geofence-data:
